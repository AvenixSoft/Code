    if (state.authUser && state.profileLoading) { render(); return; }

  const inviteCode = route.match(/^\/join\/([A-HJ-NP-Z2-9]{14})$/)?.[1];

  if (inviteCode) state.invite = null;

  if (needs && hasProfile()) state.pageLoading = true;
  render();

    if (route === "/app") {
      await Promise.all([loadMatches(), Date.now() - state.roomsAt < 45_000 ? Promise.resolve() : loadRooms(), Date.now() - state.transactionsAt < 45_000 ? Promise.resolve() : loadTransactions(), Date.now() - state.notificationsAt < 45_000 ? Promise.resolve() : loadNotifications()]);

    else if (route === "/wallet") await loadTransactions();

function rulesView() {
  return `<div class="rules-wrap"><div class="rules-intro card-entrance"><div class="overline">قوانین شفاف / GOLBIT</div><h1>رفاقت، رقابت، بدون ابهام.</h1><p>GolBit فقط یک بازی پیش‌بینی دوستانه با G-Coin مجازی است. هیچ پول، جایزهٔ نقدی، پرداخت یا بازخریدی در این محصول وجود ندارد.</p><a class="btn btn-primary" href="#${hasProfile() ? "/rooms/new" : "/register"}">${hasProfile() ? "ساخت اتاق" : "شروع رایگان"} ${icon("arrow")}</a></div>
    <div class="rule-item"><h2>۱. شروع بازی</h2><p>با ایمیل و رمز حساب بساز. پس از انتخاب نام کاربری یکتا و تکمیل پروفایل، دقیقاً یک‌بار ۱٬۵۰۰ G-Coin می‌گیری. این هدیه به همان شناسهٔ حساب تعلق دارد و قابل تکرار نیست.</p></div>
    <div class="rule-item"><h2>۲. هزینه و ورودی</h2><p>ساخت موفق اتاق دقیقاً ۱۰۰ G-Coin هزینه دارد. سازنده علاوه بر این هزینه، ورودی ثابت اتاق را هم می‌پردازد. دوستان هنگام پیوستن فقط همان ورودی را می‌پردازند. هر عدد، صحیح و قابل مشاهده در دفتر تراکنش است.</p></div>
    <div class="rule-item"><h2>۳. انتخاب نتیجه</h2><p>از بین برد میزبان، برد مهمان و مساوی یکی را برای نتیجهٔ ۹۰ دقیقه (شامل وقت تلف‌شده؛ بدون وقت اضافه یا ضربات پنالتی) انتخاب کن. ورودی هنگام ساخت/پیوستن پرداخت می‌شود؛ ثبت نتیجه کسر دوباره ندارد. انتخاب پس از ثبت تغییر نمی‌کند و بعد از مهلت سرور پذیرفته نمی‌شود. انتخاب دیگران تا پایان مهلت پنهان است.</p></div>
    <div class="rule-item"><h2>۴. تقسیم استخر</h2><p>استخر برابر مجموع ورودی اعضای فعال است. همهٔ کسانی که نتیجهٔ درست را انتخاب کرده‌اند، استخر را به‌طور مساوی می‌گیرند. مثلاً ۴ نفر × ۱۰۰ G-Coin = استخر ۴۰۰؛ اگر ۲ نفر درست گفته باشند، هر نفر ۲۰۰ می‌گیرد. اگر تقسیم عدد صحیح نباشد، ابتدا سهم صحیح به همه می‌رسد و باقیماندهٔ ۱ سکه‌ای به برندگان زودتر واردشده تعلق می‌گیرد (در زمان برابر، ترتیب شناسه). اگر هیچ‌کس درست نگوید، ورودی همهٔ اعضای فعال بازمی‌گردد.</p></div>
    <div class="rule-item"><h2>۵. نبود پیش‌بینی</h2><p>اگر وارد اتاق شوی ولی نتیجه‌ای انتخاب نکنی، ورودی‌ات در استخر می‌ماند اما برنده نمی‌شوی. اگر هیچ برنده‌ای وجود نداشته باشد، همان ورودی تو هم برمی‌گردد. برای شرکت، بهتر است انتخابت را همان ابتدا ثبت کنی.</p></div>
    <div class="rule-item"><h2>۶. ترک و لغو</h2><p>مهمان می‌تواند پیش از مهلت خارج شود و کل ورودی‌اش را بگیرد؛ پیوستن دوباره به همان اتاق ممکن نیست. سازنده فقط می‌تواند کل اتاق را پیش از مهلت لغو کند: ورودی همه برمی‌گردد، اما هزینهٔ ساخت در لغو اختیاری بازنمی‌گردد. اگر تا پایان مهلت کمتر از دو عضو باشند، یا مسابقه لغو/به‌تعویق بیفتد، همهٔ ورودی‌ها <strong>و</strong> هزینهٔ ساخت بازمی‌گردند. مسابقهٔ به‌تعویق‌افتاده به‌طور خودکار به تاریخ جدید منتقل نمی‌شود.</p></div>
    <div class="rule-item"><h2>۷. نتیجهٔ قابل اعتماد</h2><p>هیچ کاربر عادی نمی‌تواند امتیاز نهایی یا جایزه را تعیین کند. مدیر نتیجه را با منبع ثبت و دوباره تأیید می‌کند؛ سپس تراکنش‌های تسویهٔ هر اتاق به‌صورت اتمی انجام می‌شوند. اگر نتیجه قابل راستی‌آزمایی نباشد، مدیر مسابقه را لغو می‌کند و ورودی‌ها و هزینه‌های ساخت برمی‌گردند. نمایش مسابقه با برچسب «آزمایشی» به معنای دادهٔ زنده نیست.</p></div>
    <div class="rule-item"><h2>۸. حریم خصوصی</h2><p>اتاق‌های خصوصی فقط برای اعضای فعال خواندنی هستند. پیش از ورود، فقط خلاصهٔ دعوت نمایش داده می‌شود؛ نام اعضا و پیش‌بینی‌ها منتشر نمی‌شوند. نام کاربری، موجودی و دفتر تراکنش خصوصی‌اند.</p></div>
    <div class="rule-item"><h2>۹. نگهداری داده</h2><p>مسابقه‌ها در این نسخه به‌صورت دستی توسط مدیر منتشر می‌شوند. تا وقتی منبع واقعی تنظیم نشده است، هیچ امتیاز زنده یا نتیجهٔ ساختگی به‌عنوان خبر واقعی نمایش داده نمی‌شود. اگر دیدی چیزی دیر به‌روزرسانی می‌شود، صفحهٔ اتاق را تازه‌سازی کن؛ تسویه فقط با مدیر انجام می‌شود.</p></div>
    <div class="info-callout" style="margin-top:23px">${icon("help")} برای راه‌اندازی فنی و آزمون امنیت به <bdi class="ltr">docs/SETUP.md</bdi> در پوشهٔ پروژه مراجعه کن.</div></div>`;
}

function authError(message) {

async function handleAuth(form) {
  if (!CONFIGURED || !state.fb) {
    authError(state.sdkError || (VISUAL_PREVIEW ? "در حالت نمایشی ورود واقعی غیرفعال است؛ ‎?preview‎ را از نشانی صفحه حذف کن." : CONFIGURED ? "اتصال Firebase هنوز آماده نیست؛ کمی بعد دوباره تلاش کن." : "ابتدا تنظیمات واقعی Firebase را مطابق docs/SETUP.md وارد کن؛ پیش‌نمایش جداگانه در دسترس است."));
    return;
  }
  const kind = form.dataset.kind;
  const data = new FormData(form);
  const email = String(data.get("email") || "").trim();
  const password = String(data.get("password") || "");
  if (!/^\S+@\S+\.\S+$/.test(email)) { authError("ایمیل معتبر وارد کن."); return; }
  if (kind !== "forgot" && password.length < 8) { authError("رمز باید حداقل هشت کاراکتر باشد."); return; }
  if (kind === "register" && password !== data.get("confirmPassword")) { authError("رمز عبور و تکرار آن یکسان نیستند."); return; }
  if (kind === "register" && !data.get("accept")) { authError("برای ادامه، قوانین بازی را تأیید کن."); return; }
  setBusy(form, true);
  try {
    if (kind === "register") {
      await state.fb.authApi.createUserWithEmailAndPassword(state.fb.auth, email, password);
      toast("حسابت ساخته شد؛ حالا پروفایلت را تکمیل کن.");
      navigate("/onboarding");
    } else if (kind === "login") {
      await state.fb.authApi.signInWithEmailAndPassword(state.fb.auth, email, password);
      toast("خوش برگشتی!");
      // The auth observer loads the profile and routes to onboarding, a saved invite, or the dashboard.
    } else {
      await state.fb.authApi.sendPasswordResetEmail(state.fb.auth, email);
      toast("اگر این ایمیل ثبت شده باشد، لینک بازیابی فرستاده می‌شود.");
      navigate("/login");
    }
  } catch (error) {
    authError(friendly(error));
  } finally { setBusy(form, false); }
}
async function handleOnboard(form) {
  const step = state.onboardingStep;
  const data = new FormData(form);
  if (step === 0) {
    const name = String(data.get("displayName") || "").trim().replace(/\s+/g, " ");
    if (Array.from(name).length < 2 || Array.from(name).length > 45) { toast("نام را بین ۲ تا ۴۵ نویسه وارد کن.", "error"); return; }
    state.onboard.displayName = name;
  }
  if (step === 1) {
    const username = String(data.get("username") || "").trim().toLowerCase();
    if (!/^[a-z][a-z0-9_]{2,17}$/.test(username)) { toast("شناسه باید ۳ تا ۱۸ نویسهٔ لاتین باشد و با حرف شروع شود.", "error"); return; }
    state.onboard.username = username;
  }
  if (step === 2 && !clubById.has(state.onboard.favoriteTeamId)) { toast("یک تیم محبوب انتخاب کن.", "error"); return; }
  if (step === 4) {
    if (!requireRealAction()) return;
    state.onboard.country = String(data.get("country") || "");
    state.onboard.league = String(data.get("league") || "");
    setBusy(form, true);
    try {
      const result = await callable("completeOnboarding", state.onboard);
      toast(result.created ? "پروفایل ساخته شد؛ ۱٬۵۰۰ G-Coin به کیف تو اضافه شد." : "پروفایلت قبلاً ساخته شده بود؛ هدیه دوباره ثبت نشد.");
      const back = safeSession.get("golbit_return_to") || "/app";
      safeSession.remove("golbit_return_to");
      navigate(back, true);
    } catch (error) {
      if (String(error?.code).includes("already-exists")) state.onboardingStep = 1;
      toast(friendly(error), "error"); render();
    } finally { setBusy(form, false); }
    return;
  }
  state.onboardingStep = Math.min(4, step + 1);
  render();
  document.querySelector("#onboardForm input:not([type=search]), #onboardForm select, #clubSearch")?.focus();
}

    toast("نام، مسابقه، ورودی، ظرفیت و مهلت را درست وارد کن.", "error"); return;

  openModal({ title: "اتاق را بسازیم؟", message: `در صورت ساخت موفق، ۱۰۰ G-Coin هزینهٔ ساخت و ${formatted(stake)} G-Coin ورودی خودت، در مجموع ${formatted(100 + stake)} G-Coin، یک‌بار از کیف کسر می‌شود.`, confirm: "تأیید و ساخت اتاق", onConfirm: async () => {

async function copyLink(roomId) {

    }
