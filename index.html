    <div class="rule-item"><h2>\u06F1. \u0634\u0631\u0648\u0639 \u0628\u0627\u0632\u06CC</h2><p>\u0628\u0627 \u0627\u06CC\u0645\u06CC\u0644 \u0648 \u0631\u0645\u0632 \u06CC\u0627 \u0628\u062F\u0648\u0646 \u0627\u06CC\u0645\u06CC\u0644 \u0628\u0647\u200C\u0639\u0646\u0648\u0627\u0646 \u0645\u0647\u0645\u0627\u0646 \u0634\u0631\u0648\u0639 \u06A9\u0646. \u067E\u0633 \u0627\u0632 \u0627\u0646\u062A\u062E\u0627\u0628 \u0646\u0627\u0645 \u06A9\u0627\u0631\u0628\u0631\u06CC \u06CC\u06A9\u062A\u0627 \u0648 \u062A\u06A9\u0645\u06CC\u0644 \u067E\u0631\u0648\u0641\u0627\u06CC\u0644\u060C \u0647\u0631 \u0634\u0646\u0627\u0633\u0647\u0654 \u062D\u0633\u0627\u0628 (UID) \u062F\u0642\u06CC\u0642\u0627\u064B \u06CC\u06A9\u200C\u0628\u0627\u0631 \u06F1\u066C\u06F5\u06F0\u06F0 G-Coin \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F \u0648 \u0628\u0647 \u0627\u062A\u0627\u0642\u200C\u0647\u0627 \u062F\u0633\u062A\u0631\u0633\u06CC \u06A9\u0627\u0645\u0644 \u062F\u0627\u0631\u062F. \u0627\u06CC\u0646 \xAB\u06CC\u06A9\u200C\u0628\u0627\u0631 \u0628\u0631\u0627\u06CC \u0647\u0631 \u0627\u0646\u0633\u0627\u0646\xBB \u0646\u06CC\u0633\u062A\u061B \u0633\u0627\u062E\u062A \u062D\u0633\u0627\u0628\u200C\u0647\u0627\u06CC \u0645\u0647\u0645\u0627\u0646 \u0645\u062A\u0639\u062F\u062F \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A. \u0627\u06AF\u0631 \u0645\u0647\u0645\u0627\u0646 \u0647\u0633\u062A\u06CC\u060C \u067E\u06CC\u0634 \u0627\u0632 \u062E\u0631\u0648\u062C \u06CC\u0627 \u067E\u0627\u06A9\u200C\u06A9\u0631\u062F\u0646 \u062F\u0627\u062F\u0647\u200C\u0647\u0627\u06CC \u0645\u0631\u0648\u0631\u06AF\u0631\u060C \u0627\u0632 \u067E\u0631\u0648\u0641\u0627\u06CC\u0644 \u0647\u0645\u06CC\u0646 \u062D\u0633\u0627\u0628 \u0631\u0627 \u0628\u0647 \u0627\u06CC\u0645\u06CC\u0644\u0650 \u062A\u0627\u0632\u0647 \u0645\u062A\u0635\u0644 \u06A9\u0646\u060C \u0627\u06CC\u0645\u06CC\u0644 \u0631\u0627 \u062A\u0623\u06CC\u06CC\u062F \u06A9\u0646 \u0648 \u0631\u0645\u0632 \u0628\u0633\u0627\u0632\u061B \u0648\u06AF\u0631\u0646\u0647 \u062F\u0633\u062A\u0631\u0633\u06CC \u0628\u0647 \u0633\u06A9\u0647\u200C\u0647\u0627 \u0648 \u0627\u062A\u0627\u0642\u200C\u0647\u0627\u06CC\u062A \u0631\u0627 \u0627\u0632 \u062F\u0633\u062A \u0645\u06CC\u200C\u062F\u0647\u06CC.</p></div>
    <div class="rule-item"><h2>\u06F2. \u0647\u0632\u06CC\u0646\u0647 \u0648 \u0648\u0631\u0648\u062F\u06CC</h2><p>\u0633\u0627\u062E\u062A \u0645\u0648\u0641\u0642 \u0627\u062A\u0627\u0642 \u062F\u0642\u06CC\u0642\u0627\u064B \u06F1\u06F0\u06F0 G-Coin \u0647\u0632\u06CC\u0646\u0647 \u062F\u0627\u0631\u062F. \u0633\u0627\u0632\u0646\u062F\u0647 \u0639\u0644\u0627\u0648\u0647 \u0628\u0631 \u0627\u06CC\u0646 \u0647\u0632\u06CC\u0646\u0647\u060C \u0648\u0631\u0648\u062F\u06CC \u062B\u0627\u0628\u062A \u0627\u062A\u0627\u0642 \u0631\u0627 \u0647\u0645 \u0645\u06CC\u200C\u067E\u0631\u062F\u0627\u0632\u062F. \u062F\u0648\u0633\u062A\u0627\u0646 \u0647\u0646\u06AF\u0627\u0645 \u067E\u06CC\u0648\u0633\u062A\u0646 \u0641\u0642\u0637 \u0647\u0645\u0627\u0646 \u0648\u0631\u0648\u062F\u06CC \u0631\u0627 \u0645\u06CC\u200C\u067E\u0631\u062F\u0627\u0632\u0646\u062F. \u0647\u0631 \u0639\u062F\u062F\u060C \u0635\u062D\u06CC\u062D \u0648 \u0642\u0627\u0628\u0644 \u0645\u0634\u0627\u0647\u062F\u0647 \u062F\u0631 \u062F\u0641\u062A\u0631 \u062A\u0631\u0627\u06A9\u0646\u0634 \u0627\u0633\u062A.</p></div>
    <div class="rule-item"><h2>\u06F3. \u0627\u0646\u062A\u062E\u0627\u0628 \u0646\u062A\u06CC\u062C\u0647</h2><p>\u0627\u0632 \u0628\u06CC\u0646 \u0628\u0631\u062F \u0645\u06CC\u0632\u0628\u0627\u0646\u060C \u0628\u0631\u062F \u0645\u0647\u0645\u0627\u0646 \u0648 \u0645\u0633\u0627\u0648\u06CC \u06CC\u06A9\u06CC \u0631\u0627 \u0628\u0631\u0627\u06CC \u0646\u062A\u06CC\u062C\u0647\u0654 \u06F9\u06F0 \u062F\u0642\u06CC\u0642\u0647 (\u0634\u0627\u0645\u0644 \u0648\u0642\u062A \u062A\u0644\u0641\u200C\u0634\u062F\u0647\u061B \u0628\u062F\u0648\u0646 \u0648\u0642\u062A \u0627\u0636\u0627\u0641\u0647 \u06CC\u0627 \u0636\u0631\u0628\u0627\u062A \u067E\u0646\u0627\u0644\u062A\u06CC) \u0627\u0646\u062A\u062E\u0627\u0628 \u06A9\u0646. \u0648\u0631\u0648\u062F\u06CC \u0647\u0646\u06AF\u0627\u0645 \u0633\u0627\u062E\u062A/\u067E\u06CC\u0648\u0633\u062A\u0646 \u067E\u0631\u062F\u0627\u062E\u062A \u0645\u06CC\u200C\u0634\u0648\u062F\u061B \u062B\u0628\u062A \u0646\u062A\u06CC\u062C\u0647 \u06A9\u0633\u0631 \u062F\u0648\u0628\u0627\u0631\u0647 \u0646\u062F\u0627\u0631\u062F. \u0627\u0646\u062A\u062E\u0627\u0628 \u067E\u0633 \u0627\u0632 \u062B\u0628\u062A \u062A\u063A\u06CC\u06CC\u0631 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0628\u0639\u062F \u0627\u0632 \u0645\u0647\u0644\u062A \u0633\u0631\u0648\u0631 \u067E\u0630\u06CC\u0631\u0641\u062A\u0647 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F. \u0627\u0646\u062A\u062E\u0627\u0628 \u062F\u06CC\u06AF\u0631\u0627\u0646 \u062A\u0627 \u067E\u0627\u06CC\u0627\u0646 \u0645\u0647\u0644\u062A \u067E\u0646\u0647\u0627\u0646 \u0627\u0633\u062A.</p></div>
    <div class="rule-item"><h2>\u06F4. \u062A\u0642\u0633\u06CC\u0645 \u0627\u0633\u062A\u062E\u0631</h2><p>\u0627\u0633\u062A\u062E\u0631 \u0628\u0631\u0627\u0628\u0631 \u0645\u062C\u0645\u0648\u0639 \u0648\u0631\u0648\u062F\u06CC \u0627\u0639\u0636\u0627\u06CC \u0641\u0639\u0627\u0644 \u0627\u0633\u062A. \u0647\u0645\u0647\u0654 \u06A9\u0633\u0627\u0646\u06CC \u06A9\u0647 \u0646\u062A\u06CC\u062C\u0647\u0654 \u062F\u0631\u0633\u062A \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u06A9\u0631\u062F\u0647\u200C\u0627\u0646\u062F\u060C \u0627\u0633\u062A\u062E\u0631 \u0631\u0627 \u0628\u0647\u200C\u0637\u0648\u0631 \u0645\u0633\u0627\u0648\u06CC \u0645\u06CC\u200C\u06AF\u06CC\u0631\u0646\u062F. \u0645\u062B\u0644\u0627\u064B \u06F4 \u0646\u0641\u0631 \xD7 \u06F1\u06F0\u06F0 G-Coin = \u0627\u0633\u062A\u062E\u0631 \u06F4\u06F0\u06F0\u061B \u0627\u06AF\u0631 \u06F2 \u0646\u0641\u0631 \u062F\u0631\u0633\u062A \u06AF\u0641\u062A\u0647 \u0628\u0627\u0634\u0646\u062F\u060C \u0647\u0631 \u0646\u0641\u0631 \u06F2\u06F0\u06F0 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F. \u0627\u06AF\u0631 \u062A\u0642\u0633\u06CC\u0645 \u0639\u062F\u062F \u0635\u062D\u06CC\u062D \u0646\u0628\u0627\u0634\u062F\u060C \u0627\u0628\u062A\u062F\u0627 \u0633\u0647\u0645 \u0635\u062D\u06CC\u062D \u0628\u0647 \u0647\u0645\u0647 \u0645\u06CC\u200C\u0631\u0633\u062F \u0648 \u0628\u0627\u0642\u06CC\u0645\u0627\u0646\u062F\u0647\u0654 \u06F1 \u0633\u06A9\u0647\u200C\u0627\u06CC \u0628\u0647 \u0628\u0631\u0646\u062F\u06AF\u0627\u0646 \u0632\u0648\u062F\u062A\u0631 \u0648\u0627\u0631\u062F\u0634\u062F\u0647 \u062A\u0639\u0644\u0642 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F (\u062F\u0631 \u0632\u0645\u0627\u0646 \u0628\u0631\u0627\u0628\u0631\u060C \u062A\u0631\u062A\u06CC\u0628 \u0634\u0646\u0627\u0633\u0647). \u0627\u06AF\u0631 \u0647\u06CC\u0686\u200C\u06A9\u0633 \u062F\u0631\u0633\u062A \u0646\u06AF\u0648\u06CC\u062F\u060C \u0648\u0631\u0648\u062F\u06CC \u0647\u0645\u0647\u0654 \u0627\u0639\u0636\u0627\u06CC \u0641\u0639\u0627\u0644 \u0628\u0627\u0632\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F.</p></div>
    <div class="rule-item"><h2>\u06F5. \u0646\u0628\u0648\u062F \u067E\u06CC\u0634\u200C\u0628\u06CC\u0646\u06CC</h2><p>\u0627\u06AF\u0631 \u0648\u0627\u0631\u062F \u0627\u062A\u0627\u0642 \u0634\u0648\u06CC \u0648\u0644\u06CC \u0646\u062A\u06CC\u062C\u0647\u200C\u0627\u06CC \u0627\u0646\u062A\u062E\u0627\u0628 \u0646\u06A9\u0646\u06CC\u060C \u0648\u0631\u0648\u062F\u06CC\u200C\u0627\u062A \u062F\u0631 \u0627\u0633\u062A\u062E\u0631 \u0645\u06CC\u200C\u0645\u0627\u0646\u062F \u0627\u0645\u0627 \u0628\u0631\u0646\u062F\u0647 \u0646\u0645\u06CC\u200C\u0634\u0648\u06CC. \u0627\u06AF\u0631 \u0647\u06CC\u0686 \u0628\u0631\u0646\u062F\u0647\u200C\u0627\u06CC \u0648\u062C\u0648\u062F \u0646\u062F\u0627\u0634\u062A\u0647 \u0628\u0627\u0634\u062F\u060C \u0647\u0645\u0627\u0646 \u0648\u0631\u0648\u062F\u06CC \u062A\u0648 \u0647\u0645 \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F. \u0628\u0631\u0627\u06CC \u0634\u0631\u06A9\u062A\u060C \u0628\u0647\u062A\u0631 \u0627\u0633\u062A \u0627\u0646\u062A\u062E\u0627\u0628\u062A \u0631\u0627 \u0647\u0645\u0627\u0646 \u0627\u0628\u062A\u062F\u0627 \u062B\u0628\u062A \u06A9\u0646\u06CC.</p></div>
    <div class="rule-item"><h2>\u06F6. \u062A\u0631\u06A9 \u0648 \u0644\u063A\u0648</h2><p>\u0645\u0647\u0645\u0627\u0646 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u067E\u06CC\u0634 \u0627\u0632 \u0645\u0647\u0644\u062A \u062E\u0627\u0631\u062C \u0634\u0648\u062F \u0648 \u06A9\u0644 \u0648\u0631\u0648\u062F\u06CC\u200C\u0627\u0634 \u0631\u0627 \u0628\u06AF\u06CC\u0631\u062F\u061B \u067E\u06CC\u0648\u0633\u062A\u0646 \u062F\u0648\u0628\u0627\u0631\u0647 \u0628\u0647 \u0647\u0645\u0627\u0646 \u0627\u062A\u0627\u0642 \u0645\u0645\u06A9\u0646 \u0646\u06CC\u0633\u062A. \u0633\u0627\u0632\u0646\u062F\u0647 \u0641\u0642\u0637 \u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u06A9\u0644 \u0627\u062A\u0627\u0642 \u0631\u0627 \u067E\u06CC\u0634 \u0627\u0632 \u0645\u0647\u0644\u062A \u0644\u063A\u0648 \u06A9\u0646\u062F: \u0648\u0631\u0648\u062F\u06CC \u0647\u0645\u0647 \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F\u060C \u0627\u0645\u0627 \u0647\u0632\u06CC\u0646\u0647\u0654 \u0633\u0627\u062E\u062A \u062F\u0631 \u0644\u063A\u0648 \u0627\u062E\u062A\u06CC\u0627\u0631\u06CC \u0628\u0627\u0632\u0646\u0645\u06CC\u200C\u06AF\u0631\u062F\u062F. \u0627\u06AF\u0631 \u062A\u0627 \u067E\u0627\u06CC\u0627\u0646 \u0645\u0647\u0644\u062A \u06A9\u0645\u062A\u0631 \u0627\u0632 \u062F\u0648 \u0639\u0636\u0648 \u0628\u0627\u0634\u0646\u062F\u060C \u06CC\u0627 \u0645\u0633\u0627\u0628\u0642\u0647 \u0644\u063A\u0648/\u0628\u0647\u200C\u062A\u0639\u0648\u06CC\u0642 \u0628\u06CC\u0641\u062A\u062F\u060C \u0647\u0645\u0647\u0654 \u0648\u0631\u0648\u062F\u06CC\u200C\u0647\u0627 <strong>\u0648</strong> \u0647\u0632\u06CC\u0646\u0647\u0654 \u0633\u0627\u062E\u062A \u0628\u0627\u0632\u0645\u06CC\u200C\u06AF\u0631\u062F\u0646\u062F. \u0645\u0633\u0627\u0628\u0642\u0647\u0654 \u0628\u0647\u200C\u062A\u0639\u0648\u06CC\u0642\u200C\u0627\u0641\u062A\u0627\u062F\u0647 \u0628\u0647\u200C\u0637\u0648\u0631 \u062E\u0648\u062F\u06A9\u0627\u0631 \u0628\u0647 \u062A\u0627\u0631\u06CC\u062E \u06     <div class="rule-item"><h2>\u06F7. \u0646\u062A\u06CC\u062C\u0647\u0654 \u0642\u0627\u0628\u0644 \u0627\u0639\u062A\u0645\u0627\u062F</h2><p>\u0647\u06CC\u0686 \u06A9\u0627\u0631\u0628\u0631 \u0639\u0627\u062F\u06CC \u0646\u0645\u06CC\u200C\u062A\u0648\u0627\u0646\u062F \u0627\u0645\u062A\u06CC\u0627\u0632 \u0646\u0647\u0627\u06CC\u06CC \u06CC\u0627 \u062C\u0627\u06CC\u0632\u0647 \u0631\u0627 \u062A\u0639\u06CC\u06CC\u0646 \u06A9\u0646\u062F. \u0645\u062F\u06CC\u0631 \u0646\u062A\u06CC\u062C\u0647 \u0631\u0627 \u0628\u0627 \u0645\u0646\u0628\u0639 \u062B\u0628\u062A \u0648 \u062F\u0648\u0628\u0627\u0631\u0647 \u062A\u0623\u06CC\u06CC\u062F \u0645\u06CC\u200C\u06A9\u0646\u062F\u061B \u0633\u067E\u0633 \u062A\u0631\u0627\u06A9\u0646\u0634\u200C\u0647\u0627\u06CC \u062A\u0633\u0648\u06CC\u0647\u0654 \u0647\u0631 \u0627\u062A\u0627\u0642 \u0628\u0647\u200C\u0635\u0648\u0631\u062A \u0627\u062A\u0645\u06CC \u0627\u0646\u062C\u0627\u0645 \u0645\u06CC\u200C\u0634\u0648\u0646\u062F. \u0627\u06AF\u0631 \u0646\u062A\u06CC\u062C\u0647 \u0642\u0627\u0628\u0644 \u0631\u0627\u0633\u062A\u06CC\u200C\u0622\u0632\u0645\u0627\u06CC\u06CC \u0646\u0628\u0627\u0634\u062F\u060C \u0645\u062F\u06CC\u0631 \u0645\u0633\u0627\u0628\u0642\u0647 \u0631\u0627 \u0644\u063A\u0648 \u0645\u06CC\u200C\u06A9\u0646\u062F \u0648 \u0648\u0631\u0648\u062F\u06CC\u200C\u0647\u0627 \u0648 \u0647\u0632\u06CC\u0646\u0647\u200C\u0647\u0627\u06CC \u0633\u0627\u062E\u062A \u0628\u0631\u0645\u06CC\u200C\u06AF\u0631\u062F\u0646\u062F. \u0646\u0645\u0627\u06CC\u0634 \u0645\u0633\u0627\u0628\u0642\u0647 \u0628\u0627 \u0628\u0631\u0686\u0633\u0628 \xAB\u0622\u0632\u0645\u0627\u06CC\u0634\u06CC\xBB \u0628\u0647 \u0645\u0639\u0646\u0627\u06CC \u062F\u0627\u062F\u0647\u0654 \u0632\u0646\u062F\u0647 \u0646\u06CC\u0633\u062A.</p></div>
