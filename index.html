  /* ================= REFRESH ================= */
  function refreshCurrent(){
    switch (state.view){
      case 'home': renderHome(); break;
      case 'search': renderSearch(); break;
      case 'library': renderLibrary(); break;
      case 'liked': renderLiked(); break;
      case 'playlist': renderPlaylistDetail(); break;
      case 'folder': renderFolderDetail(); break;
    }
    updateNav();
  }

  /* ================= ROW BINDING ================= */
  function bindSongList(scope, opts={}){
    scope.querySelectorAll('.song-row').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.closest('.mini-btn')) return;
        const id = row.dataset.id;
        const track = state.songs.find(s=>s.id===id);
        if (!track) return;
        const contextIds = opts.contextIds || allVisibleIds(scope);
        Player.playTrack(track, contextIds, contextIds.indexOf(id));
        toggleNowPlaying(true);
      });
      row.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/song-id', row.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragover', e => { e.preventDefault(); });
      row.addEventListener('drop', e => {
        e.preventDefault();
        const srcId = e.dataTransfer.getData('text/song-id');
        const dstId = row.dataset.id;
        if (srcId && srcId !== dstId) reorderInContext(srcId, dstId);
      });
    });
    scope.querySelectorAll('.act-like').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      Player.toggleLike(b.dataset.id);
    }));
    scope.querySelectorAll('.act-more').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      openSongActions(b.dataset.id, b);
    }));
  }
  function allVisibleIds(scope){ return $$('.song-row', scope).map(r=>r.dataset.id).filter(Boolean); }
  function reorderInContext(srcId, dstId){
    if (state.view === 'playlist'){
      const p = state.playlists.find(x=>x.id===state.viewParams.id);
      if (!p) return;
      const arr = p.songIds;
      const si = arr.indexOf(srcId), di = arr.indexOf(dstId);
      if (si < 0 || di < 0) return;
      arr.splice(di, 0, arr.splice(si,1)[0]);
      DB.savePlaylists(state.playlists);
      renderPlaylistDetail();
    } else if (state.view === 'folder'){
      const f = state.folders.find(x=>x.id===state.viewParams.id);
      if (!f) return;
      const arr = f.songIds;
      const si = arr.indexOf(srcId), di = arr.indexOf(dstId);
      if (si < 0 || di < 0) return;
      arr.splice(di, 0, arr.splice(si,1)[0]);
      DB.saveFolders(state.folders);
      renderFolderDetail();
    } else {
      UI.toast('Drag inside a playlist or folder to reorder', 'info');
    }
  }
  function refreshLikeButtons(id){
    $$(`.act-like[data-id="${id}"]`).forEach(b => {
      const t = state.songs.find(s=>s.id===id);
      b.classList.toggle('liked', !!(t && t.liked));
      b.innerHTML = (t && t.liked) ? ICONS.heartFill : ICONS.heart;
    });
  }
  function refreshRows(){
    $$('.song-row').forEach(row => {
      const t = state.songs.find(s=>s.id===row.dataset.id);
      row.classList.toggle('playing', !!(t && Player.current && Player.current.id===t.id));
      const title = row.querySelector('.song-title');
      if (title && t && Player.current && Player.current.id===t.id){
        const eq = `<span class="eq ${Player.playing?'':'paused'}"><span></span><span></span><span></span></span>`;
        title.innerHTML = eq + escapeHtml(t.title);
      } else if (title && t){
        title.textContent = t.title;
      }
    });
  }

  /* ================= SONG ACTIONS ================= */
  function openSongActions(id){
    const t = state.songs.find(s=>s.id===id);
    if (!t) return;
    openSheet(escapeHtml(t.title), `
      <div class="sa-head">
        <div class="sa-cover">${coverInner(t)}</div>
        <div class="sa-meta">
          <div class="sa-title">${escapeHtml(t.artist)}</div>
          <div class="sa-sub">${fmtTime(t.duration)}</div>
        </div>
      </div>
      <div class="sheet-list">
        <button class="sheet-option" id="sa-play">${ICONS.play}<span class="opt-name">Play</span></button>
        <button class="sheet-option" id="sa-playnext">${ICONS.queue}<span class="opt-name">Play next</span></button>
        <button class="sheet-option" id="sa-like">${t.liked?ICONS.heartFill:ICONS.heart}<span class="opt-name">${t.liked?'Remove from Liked':'Add to Liked'}</span></button>
        <button class="sheet-option" id="sa-addpl">${ICONS.addToPlaylist}<span class="opt-name">Add to playlist…</span></button>
        <button class="sheet-option" id="sa-addfo">${ICONS.folder}<span class="opt-name">Add to folder…</span></button>
        <button class="sheet-option danger" id="sa-del">${ICONS.trash}<span class="opt-name">Remove from library</span></button>
      </div>`);
    $('#sa-play').onclick = () => { closeSheet(); const ids = state.songs.map(s=>s.id); Player.playTrack(t, ids, ids.indexOf(id)); };
    $('#sa-playnext').onclick = () => { closeSheet(); playNext(id); };
    $('#sa-like').onclick = () => { closeSheet(); Player.toggleLike(id); };
    $('#sa-addpl').onclick = () => { openAddToPlaylistSheet(id); };
    $('#sa-addfo').onclick = () => { openAddToFolderSheet(id); };
    $('#sa-del').onclick = () => { closeSheet(); deleteSongs([id]); };
  }

  function playNext(id){
    if (!Player.current){ const ids = state.songs.map(s=>s.id); const t = state.songs.find(s=>s.id===id); Player.playTrack(t, ids, ids.indexOf(id)); return; }
    const i = state.queue.indexOf(id);
    if (i >= 0) state.queue.splice(i,1);
    state.queue.splice(state.qIndex+1, 0, id);
    UI.toast('Added to "Play next"','ok');
  }

    openSheet('Add to playlist', `

        ${state.playlists.length ? state.playlists.map(p => `
          <button class="sheet-option ${p.songIds.includes(songId)?'selected':''}" data-pl="${p.id}">

      const i = p.songIds.indexOf(songId);

          </button>`).join('') : `<div class="muted" style="text-align:center;padding:14px">No folders yet</div>`}
      </div>
      <div class="btn-row"><button class="btn-primary-full" id="af-new">${ICONS.plus} New folder</button></div>`);
    $$('#sheet-body .sheet-option[data-fo]').forEach(b => b.onclick = async () => {
      const f = state.folders.find(x=>x.id===b.dataset.fo);
      if (!f) return;
      const i = f.songIds.indexOf(songId);
      if (i >= 0) f.songIds.splice(i,1); else f.songIds.push(songId);
      await DB.saveFolders(state.folders);
      closeSheet();
      UI.toast(f.songIds.includes(songId) ? `Added to "${f.name}"` : `Removed from "${f.name}"`, 'ok');
      refreshCurrent();
    });
    $('#af-new').onclick = () => openFolderSheet(null, songId);
  }

  /* ================= PLAYLIST / FOLDER SHEETS ================= */
  const GRADS = [
    ['#6d5ef0','#22d3ee'],['#f43f5e','#f59e0b'],['#10b981','#0ea5e9'],
    ['#8b5cf6','#ec4899'],['#e11d48','#7c3aed'],['#0ea5e9','#6366f1'],
    ['#f59e0b','#ef4444'],['#22c55e','#0d9488']
  ];
  function gradPickHTML(selectedGrad){
    return `<div class="swatches">${GRADS.map((g,i) => `
      <div class="swatch ${(!selectedGrad && i===0) || selectedGrad===`grad-${i}` ? 'active':''}" data-grad="grad-${i}" style="background:linear-gradient(135deg,${g[0]},${g[1]})"></div>`).join('')}</div>`;
  }
  function detailGradCSS(item){
    // per-item hero gradient: playlist's chosen grad, or folder default purple/pink
    if (item && item.grad){
      const m = String(item.grad).match(/^grad-(\d+)$/);
      if (m && GRADS[+m[1]]){
        const g = GRADS[+m[1]];
        return `linear-gradient(160deg, ${g[0]} 0%, ${g[1]} 60%, ${g[0]} 140%)`;
      }
    }
    return null;
  }

  function openPlaylistSheet(pl, seedSongId){
    const isEdit = !!pl;
    openSheet(isEdit ? 'Edit playlist' : 'New playlist', `
      <div class="field"><label>Name</label><input class="input" id="pl-name" value="${escapeHtml(pl?pl.name:'')}" placeholder="e.g. Road trip"></div>
      <div class="field"><label>Description (optional)</label><input class="input" id="pl-desc" value="${escapeHtml(pl?(pl.desc||''):'')}" placeholder="A short description"></div>
      <div class="field"><label>Cover color</label>${gradPickHTML(pl ? pl.grad : null)}</div>
      <div class="field"><label>Cover image (optional)</label>
        <div class="cover-pick" id="pl-cover-pick">
          ${pl && pl.coverURL ? `<img src="${pl.coverURL}" alt="">` : `<div style="font-size:22px;opacity:.5">${ICONS.upload}</div>`}
          <span class="cp-label">${pl && pl.coverURL ? 'Change image' : 'Choose cover image'}</span>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-secondary" id="pl-cancel">Cancel</button>
        <button class="btn-primary-full" id="pl-save">Save</button>
      </div>`);
    let gradSel = pl ? pl.grad : 'grad-0';
    let coverFile = null;
    $$('#sheet-body .swatch').forEach(sw => sw.onclick = () => {
      $$('#sheet-body .swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
      gradSel = sw.dataset.grad;
    });
    $('#pl-cover-pick').onclick = () => {
      const inp = $('#cover-input');
      inp.value = '';
      inp.onchange = e => {
        const f = e.target.files[0];
        if (!f) return;
        coverFile = f;
        const r = new FileReader();
        r.onload = ev => { $('#pl-cover-pick').innerHTML = `<img src="${ev.target.result}" alt=""><span class="cp-label">Change image</span>`; };
        r.readAsDataURL(f);
      };
      inp.click();
    };
    $('#pl-cancel').onclick = closeSheet;
    $('#pl-save').onclick = async () => {
      const nameVal = $('#pl-name').value.trim();
      if (!nameVal){ UI.toast('Enter a playlist name','err'); return; }
      const entry = pl ? Object.assign({}, pl) : { id: uid(), songIds: [], createdAt: Date.now() };
      entry.name = nameVal;
      entry.desc = $('#pl-desc').value.trim();
      entry.grad = gradSel;
      if (coverFile) entry.coverURL = await readImageDataUrl(coverFile);
      if (seedSongId && !entry.songIds.includes(seedSongId)) entry.songIds.push(seedSongId);
      if (!pl) state.playlists.unshift(entry);
      await DB.savePlaylists(state.playlists);
      closeSheet();
      refreshCurrent();
      UI.toast(isEdit ? 'Playlist updated' : 'Playlist created','ok');
    };
  }

  function openFolderSheet(f, seedSongId){
    const isEdit = !!f;
    openSheet(isEdit ? 'Edit folder' : 'New folder', `
      <div class="field"><label>Name</label><input class="input" id="fo-name" value="${escapeHtml(f?f.name:'')}" placeholder="e.g. Instrumental"></div>
      <div class="btn-row">
        <button class="btn-secondary" id="fo-cancel">Cancel</button>
        <button class="btn-primary-full" id="fo-save">Save</button>
      </div>`);
    $('#fo-cancel').onclick = closeSheet;
    $('#fo-save').onclick = async () => {
      const nameVal = $('#fo-name').value.trim();
      if (!nameVal){ UI.toast('Enter a folder name','err'); return; }
      const entry = f ? Object.assign({}, f) : { id: uid(), songIds: [], createdAt: Date.now() };
      entry.name = nameVal;
      if (seedSongId && !entry.songIds.includes(seedSongId)) entry.songIds.push(seedSongId);
      if (!f) state.folders.unshift(entry);
      await DB.saveFolders(state.folders);
      closeSheet();
      refreshCurrent();
      UI.toast(isEdit ? 'Folder updated' : 'Folder created','ok');
    };
  }

  function openAddSongsSheet(targetId, type){
    const target = type === 'playlist' ? state.playlists.find(x=>x.id===targetId) : state.folders.find(x=>x.id===targetId);
    if (!target) return;
    const available = state.songs.filter(s => !target.songIds.includes(s.id));
    openSheet('Add songs', `
      <div class="search-wrap" style="margin:0 0 12px">${ICONS.search}<input class="search-input" id="as-search" placeholder="Search…" style="height:44px"></div>
      <div class="sheet-list" id="as-list">
        ${available.length ? available.map(s => `
          <button class="sheet-option" data-id="${s.id}">
            <div class="opt-cover">${coverInner(s)}</div>
            <span class="opt-name">${escapeHtml(s.title)}<br><span style="font-size:11px;color:var(--text-secondary)">${escapeHtml(s.artist)}</span></span>
          </button>`).join('') : `<div class="muted" style="text-align:center;padding:14px">All songs are already added</div>`}
      </div>`);
    const filter = () => {
      const q = $('#as-search').value.trim().toLowerCase();
      $$('#as-list .sheet-option').forEach(o => {
        const s = state.songs.find(x=>x.id===o.dataset.id);
        o.style.display = (!q || (s && (s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)))) ? '' : 'none';
      });
    };
    $('#as-search').addEventListener('input', filter);
    $$('#as-list .sheet-option').forEach(b => b.onclick = async () => {
      const id = b.dataset.id;
      if (!target.songIds.includes(id)) target.songIds.push(id);
      await (type==='playlist' ? DB.savePlaylists(state.playlists) : DB.saveFolders(state.folders));
      closeSheet();
      UI.toast('Added','ok');
      refreshCurrent();
    });
  }

  function readImageDataUrl(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  /* ================= PLAYER CHROME ================= */
  function renderPlayer(){
    const t = Player.current;
    const playing = Player.playing;
    const playIco = playing ? ICONS.pause : ICONS.play;
    $('#mp-play').innerHTML = playIco;
    $('#np-play').innerHTML = playing ? ICONS.pause : ICONS.play;

    const mini = $('#mini-player');
    if (!t){
      mini.classList.remove('show');
      $('#np-art').innerHTML = coverHTML(null, 'cover-fallback');
      $('#np-title').textContent = '—';
      $('#np-artist').textContent = '—';
      const npl = $('#np-like'); if (npl){ npl.classList.remove('liked'); npl.innerHTML = ICONS.heart; }
      const mpl = $('#mp-like'); if (mpl){ mpl.classList.remove('liked'); mpl.innerHTML = ICONS.heart; }
      renderSeek(true);
      renderShuffleRepeat();
      return;
    }
    mini.classList.add('show');
    $('#mp-cover').innerHTML = coverInner(t);
    $('#mp-title').textContent = t.title;
    $('#mp-artist').textContent = t.artist;
    $('#np-art').innerHTML = coverInner(t);
    $('#np-title').textContent = t.title;
    $('#np-artist').textContent = t.artist;
    const npl = $('#np-like'); if (npl){ npl.classList.toggle('liked', !!t.liked); npl.innerHTML = t.liked ? ICONS.heartFill : ICONS.heart; }
    const mpl = $('#mp-like'); if (mpl){ mpl.classList.toggle('liked', !!t.liked); mpl.innerHTML = t.liked ? ICONS.heartFill : ICONS.heart; }
    renderShuffleRepeat();
    renderSeek(true);
    renderQueueSheetIfOpen();
  }

  function renderShuffleRepeat(){
    const s = state.settings;
    $('#np-shuffle').classList.toggle('toggled', !!s.shuffle);
    $('#np-repeat').classList.toggle('toggled', s.repeat !== 'off');
    $('#np-repeat').innerHTML = s.repeat === 'one' ? ICONS.repeatOne : ICONS.repeat;
  }

  function renderSeek(force){
    const a = Player.audio;
    const dur = isFinite(a.duration) ? a.duration : (Player.current ? Player.current.duration : 0);
    const cur = a.currentTime || 0;
    $('#np-dur').textContent = fmtTime(dur);
    $('#np-cur').textContent = fmtTime(cur);
    const pct = dur ? Math.min(100, cur/dur*100) : 0;
    $('#np-seek-fill').style.width = pct+'%';
    $('#np-seek-thumb').style.left = pct+'%';
    $('#mp-progress-fill').style.width = pct+'%';
  }

  function renderVolume(){
    const a = Player.audio;
    const slider = $('#np-vol');
    if (slider){
      const pct = Math.round(a.volume * 100);
      slider.value = pct;
      slider.style.background = 'linear-gradient(to right, #fff 0%, #fff ' + pct + '%, #2A2A2A ' + pct + '%)';
    }
    const btn = $('#np-vol-btn');
    if (btn) btn.innerHTML = (a.volume === 0) ? ICONS.mute : ICONS.vol;
  }

  /* ---------------- queue sheet ---------------- */
  let queueOpen = false;
  function renderQueueSheetIfOpen(){ if (queueOpen) openQueueSheet(); }
  function openQueueSheet(){
    queueOpen = true;
    openSheet('Queue', `
      <div class="sheet-list" id="queue-list">
        ${state.queue.length ? state.queue.map((id,i) => {
          const t = state.songs.find(s=>s.id===id);
          if (!t) return '';
          const active = i === state.qIndex;
          return `<div class="sheet-option ${active?'selected':''}" data-qindex="${i}" style="cursor:pointer">
            <div class="opt-cover">${coverInner(t)}</div>
            <span class="opt-name">${active?'▶ ':''}${escapeHtml(t.title)}<br><span style="font-size:11px;color:var(--text-secondary)">${escapeHtml(t.artist)}</span></span>
            <span style="font-size:11px;color:var(--text-muted)">${fmtTime(t.duration)}</span>
          </div>`;
        }).join('') : `<div class="muted" style="text-align:center;padding:14px">Queue is empty</div>`}
      </div>
      ${state.queue.length ? `<div class="btn-row"><button class="btn-danger" id="queue-clear">Clear queue</button></div>` : ''}`);
    $$('#queue-list .sheet-option').forEach(o => o.onclick = () => {
      Player.playAt(parseInt(o.dataset.qindex, 10));
      renderPlayer();
    });
    const qc = $('#queue-clear');
    if (qc) qc.onclick = () => {
      state.queue = []; state.qIndex = -1;
      Player.audio.pause();
      Player.audio.removeAttribute('src');
      closeSheet();
      queueOpen = false;
      UI.renderPlayer();
      UI.toast('Queue cleared','info');
    };
  }

  /* ================= FILE PICKER & GLOBAL ================= */
  function openFilePicker(){ $('#file-input').click(); }

  function wireGlobal(){
    $('#btn-upload-top').addEventListener('click', openFilePicker);
    $('#nav-fab-add').addEventListener('click', openAddSheet);
    $('#file-input').addEventListener('change', e => { importFiles(e.target.files); e.target.value=''; });

    $$('.bottom-nav-item').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

    $('#btn-theme').addEventListener('click', toggleTheme);
    $('#sheet-close').addEventListener('click', closeSheet);
    $('#sheet-overlay').addEventListener('click', e => { if (e.target === $('#sheet-overlay')) { closeSheet(); queueOpen = false; } });

    $('#mp-play').addEventListener('click', e => { e.stopPropagation(); Player.toggle(); });
    $('#mp-next').addEventListener('click', e => { e.stopPropagation(); Player.next(); });
    $('#mp-like').addEventListener('click', e => { e.stopPropagation(); if (Player.current) Player.toggleLike(); });
    $('#mini-player').addEventListener('click', () => { if (Player.current) toggleNowPlaying(true); });

    $('#np-close').addEventListener('click', ()=>toggleNowPlaying(false));
    $('#np-play').addEventListener('click', ()=>Player.toggle());
    $('#np-prev').addEventListener('click', ()=>Player.prev());
    $('#np-next').addEventListener('click', ()=>Player.next());
    $('#np-shuffle').addEventListener('click', ()=>Player.toggleShuffle());
    $('#np-repeat').addEventListener('click', ()=>Player.cycleRepeat());
    $('#np-queue').addEventListener('click', ()=>{ toggleNowPlaying(false); openQueueSheet(); });
    $('#np-like').addEventListener('click', ()=>{ if (Player.current) Player.toggleLike(); else UI.toast('Play a song first','info'); });
    $('#np-more').addEventListener('click', ()=>{ if (Player.current){ const id = Player.current.id; toggleNowPlaying(false); setTimeout(()=>openSongActions(id), 150); } });
    bindSeek($('#np-seek'), f => Player.seekTo(f));
    const volSlider = $('#np-vol');
    const applyVolPos = (clientX) => {
      const r = volSlider.getBoundingClientRect();
      if (!r.width) return;
      let f = (clientX - r.left) / r.width;
      f = Math.max(0, Math.min(1, f));
      volSlider.value = Math.round(f * 100);
      Player.setVolume(f);
    };
    volSlider.addEventListener('input', () => Player.setVolume(parseInt(volSlider.value, 10) / 100));
    volSlider.addEventListener('change', () => Player.setVolume(parseInt(volSlider.value, 10) / 100));
    let volDragging = false;
    volSlider.addEventListener('pointerdown', e => { volDragging = true; try{volSlider.setPointerCapture(e.pointerId);}catch(_){} applyVolPos(e.clientX); });
    volSlider.addEventListener('pointermove', e => { if (volDragging) applyVolPos(e.clientX); });
    volSlider.addEventListener('pointerup', () => { volDragging = false; });
    volSlider.addEventListener('pointercancel', () => { volDragging = false; });
    $('#np-vol-btn').addEventListener('click', () => {
      if (Player.audio.volume > 0) Player.setVolume(0);
      else Player.setVolume(Player.lastVol || 0.8);
    });

    // sheet: tap scrim to dismiss
    $('#np-scrim').addEventListener('click', ()=>toggleNowPlaying(false));

    // sheet: swipe-down to dismiss (on non-interactive areas)
    const npSheet = $('#nowplaying');
    let swipeY = null, swipeStartTarget = null;
    npSheet.addEventListener('pointerdown', e => {
      swipeStartTarget = e.target;
      swipeY = e.clientY;
    });
    npSheet.addEventListener('pointerup', e => {
      if (swipeY == null) return;
      const dy = e.clientY - swipeY;
      const interactive = e.target.closest('button,input,.seek,label');
      if (dy > 90 && !interactive && !swipeStartTarget.closest('button,input,.seek')) toggleNowPlaying(false);
      swipeY = null;
    });

    document.addEventListener('keydown', e => {
      const tag = (e.target.tagName||'').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.code === 'Space'){ e.preventDefault(); Player.toggle(); }
      else if (e.code === 'ArrowRight'){ if (e.shiftKey) Player.next(); else Player.seekBy(5); }
      else if (e.code === 'ArrowLeft'){ if (e.shiftKey) Player.prev(); else Player.seekBy(-5); }
      else if (e.code === 'KeyM'){ Player.toggleLike(); }
    });

    let dragDepth = 0;
    window.addEventListener('dragenter', e => {
      e.preventDefault();
      if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')){ dragDepth++; $('#drop-zone').classList.add('show'); }
    });
    window.addEventListener('dragover', e => { e.preventDefault(); });
    window.addEventListener('dragleave', e => { dragDepth--; if (dragDepth<=0){ dragDepth=0; $('#drop-zone').classList.remove('show'); } });
    window.addEventListener('drop', e => {
      e.preventDefault();
      dragDepth = 0;
      $('#drop-zone').classList.remove('show');
      if (e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
    });

    window.addEventListener('pagehide', ()=>Player.persistLast());

    // Keep the floating dock (nav + mini player) pinned correctly on first paint,
    // incl. installed PWA where iOS can misplace fixed elements until a scroll.
    const pinDock = () => {
      const nav = document.querySelector('.bottom-nav');
      const mp = document.querySelector('.mini-player');
      if (nav) { void nav.offsetWidth; }
      if (mp) { void mp.offsetWidth; }
    };
    window.addEventListener('load', pinDock);
    window.addEventListener('pageshow', pinDock);
    window.addEventListener('resize', pinDock);
    window.addEventListener('orientationchange', pinDock);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', pinDock);
    setTimeout(pinDock, 80);
    setTimeout(pinDock, 400);
    setTimeout(pinDock, 1200);
  }

  function openAddSheet(){
    openSheet('Add to Tuneo', `
      <div class="sheet-list">
        <button class="sheet-option" id="add-music">${ICONS.upload}<span class="opt-name"><b>Add music</b><br><span style="font-size:11px;color:var(--text-secondary)">Import MP3, M4A, FLAC, WAV…</span></span></button>
        <button class="sheet-option" id="add-playlist">${ICONS.list}<span class="opt-name"><b>New playlist</b><br><span style="font-size:11px;color:var(--text-secondary)">Organize your songs</span></span></button>
        <button class="sheet-option" id="add-folder">${ICONS.folder}<span class="opt-name"><b>New folder</b><br><span style="font-size:11px;color:var(--text-secondary)">Group your music</span></span></button>
      </div>`);
    $('#add-music').onclick = () => { closeSheet(); openFilePicker(); };
    $('#add-playlist').onclick = () => { openPlaylistSheet(null); };
    $('#add-folder').onclick = () => { openFolderSheet(null); };
  }

  function toggleTheme(){
    state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', state.settings.theme);
    applyTones(Player.current);
    DB.saveSettings(state.settings);
    $('#theme-ico').innerHTML = state.settings.theme === 'dark'
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>';
  }

  function bindSeek(el, cb){
    const update = e => {
      const r = el.getBoundingClientRect();
      let f = (e.clientX - r.left) / r.width;
      f = Math.max(0, Math.min(1, f));
      cb(f);
    };
    let dragging = false;
    el.addEventListener('pointerdown', e => { dragging = true; el.setPointerCapture(e.pointerId); update(e); });
    el.addEventListener('pointermove', e => { if (dragging) update(e); });
    el.addEventListener('pointerup', e => { dragging = false; });
    el.addEventListener('pointercancel', ()=> { dragging = false; });
  }

  function toggleNowPlaying(open){
    $('#nowplaying').classList.toggle('open', open);
    $('#np-scrim').classList.toggle('show', open);
    if (open) renderPlayer();
  }
  function openNowPlaying(){ if (Player.current) toggleNowPlaying(true); }

  async function init(){
    await DB.open();
    await loadLibrary();
    document.documentElement.setAttribute('data-theme', state.settings.theme);
    $('#theme-ico').innerHTML = state.settings.theme === 'dark'
      ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
      : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>';
    wireGlobal();
    renderHome();
    updateNav();
    renderPlayer();
    renderVolume();
  }

  return {
    init, go, refreshCurrent, renderPlayer, renderSeek, renderVolume,
    refreshLikeButtons, refreshRows, toast, confirm, openSheet, closeSheet,
    updateStats(){}, openQueueSheet
  };
})();

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', () => UI.init());
} else {
  UI.init();
}

/* expose internals for debugging / e2e */
window.TUNEO = { state, DB, Player, UI, importFiles, deleteSongs, parseID3v2, parseMP4, parseFLAC };




</script>
